name: CI
on: [push, pull_request, workflow_dispatch, workflow_call]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"
      - run: deno task check
      - run: deno publish --dry-run

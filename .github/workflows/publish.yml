name: Publish
on:
  release:
    types: [published]
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"
      - run: deno publish
